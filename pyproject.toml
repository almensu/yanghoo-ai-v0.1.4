[project]
name = "yanghoo-ai"
version = "0.1.6"
description = "AI-powered video/audio processing application with subtitle extraction and block-based document management"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.15.0",
    "pydantic>=2.0.0",
    "yt-dlp>=2025.3.31",
    "python-multipart>=0.0.5",
    "aiofiles>=0.8.0",
    "ffmpeg-python>=0.2.0",
    "whisperx>=3.1.1",
    "aiohttp>=3.9.0",
    "webvtt-py>=0.4.6",
    "openai",
    "httpx[socks]",
    "librosa",
    "markdown2",
    "requests>=2.28.0",
    "spacy>=3.4.0",
    "stanza>=1.4.0",
    "onnxruntime>=1.15.0,<1.17.0",
    "google-genai",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.1",
    "mypy>=1.8",
]
